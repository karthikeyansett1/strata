name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSTRATA_ASAN=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # TSan requires a compatible address-space layout on this runner.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSTRATA_TSAN=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y pybind11-dev python3-dev python3-numpy
      - run: >-
          cmake -S . -B build-python -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DSTRATA_BUILD_PYTHON=ON -DPython_EXECUTABLE=/usr/bin/python3
      - run: cmake --build build-python --target strata_python
      - run: PYTHONPATH=build-python /usr/bin/python3 -m unittest discover -s python/tests -v
